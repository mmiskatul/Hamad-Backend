services:
  backend:
    build:
      context: .
      target: development
    init: true
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - .env
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_attachments:/app/storage/chat-attachments
    stop_grace_period: 10s

volumes:
  backend_node_modules:
  backend_attachments:
