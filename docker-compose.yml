services:
  backend:
    build:
      context: .
      target: dependencies
    command: npm run dev
    ports:
      - "4000:4000"
    env_file:
      - .env.example
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  backend_node_modules:
